[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canister-manager"
version = "0.1.0"
description = "ARCCONF inventory, RAID operation plans, and removable RAID6 mirror monitoring"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
canisterctl = "canister.cli:main"

[tool.setuptools]
packages = ["canister"]
